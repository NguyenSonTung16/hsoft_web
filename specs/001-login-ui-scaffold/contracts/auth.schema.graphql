type UserProfile {
  id: ID!
  username: String!
  displayName: String!
  roleCodes: [String!]!
  facilityId: ID!
  labAreaId: ID!
}

type SessionBootstrap {
  sessionToken: String
  expiresAt: String
  reauthRequired: Boolean!
}

type FacilityOption {
  id: ID!
  code: String!
  name: String!
  isActive: Boolean!
}

type LabAreaOption {
  id: ID!
  facilityId: ID!
  code: String!
  name: String!
  isActive: Boolean!
}

type LoginError {
  code: String!
  message: String!
}

type LoginResult {
  success: Boolean!
  session: SessionBootstrap
  user: UserProfile
  errors: [LoginError!]!
}

input LoginInput {
  username: String!
  password: String!
  facilityId: ID!
  labAreaId: ID!
  workDate: String!
}

type Query {
  facilityOptions: [FacilityOption!]!
  labAreaOptions(facilityId: ID!): [LabAreaOption!]!
}

type Mutation {
  login(input: LoginInput!): LoginResult!
}
